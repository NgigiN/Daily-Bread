# Deploy bible-bot to the VPS on every push to main.
# Build runs on the server (layer cache keeps it short for small Python app).
#
# Required GitHub secrets:
#   SERVER_HOST      — VPS hostname or IP
#   SERVER_USER      — SSH user (e.g. deploy)
#   SERVER_PORT      — SSH port
#   SERVER_SSH_KEY   — the ci-bible ed25519 private key (project-scoped, see below)
#
# PROJECT_PATH is no longer used: the path lives in the VPS-side deploy script, because
# this key can no longer send arbitrary commands that would need it.

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-bible-production
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH deploy (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        # Plain `ssh`, not appleboy/ssh-action. SERVER_SSH_KEY is now a per-project key whose
        # VPS-side authorized_keys entry carries a forced command
        # (infra-ops: docs/superpowers/specs/2026-09-22-ci-key-isolation.md). The only thing
        # this may send is the bare verb `deploy`; an action that wraps the script in a shell
        # invocation would be refused by the dispatcher.
        #
        # The deploy steps moved to the VPS verbatim at
        #   /home/deploy/deploy-scripts/bible.sh
        # Edit them there, not here. This key cannot read any other project's files.
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              -p "${{ secrets.SERVER_PORT }}" \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" deploy
