# Daily Bread bot — host-only port; nginx terminates TLS and proxies in.
#
#   docker compose up -d --build
#   curl http://127.0.0.1:5555/health
#
# Grafana Alloy auto-scrapes stdout as:
#   {job="docker", container="bible-bot"}
#
# Daily push (host cron, not exposed):
#   docker compose exec -T bot python daily_bread.py

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: bible-bot:latest
    container_name: bible-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Must be 0.0.0.0 inside the network namespace so published port works.
      # Public exposure is blocked by host bind 127.0.0.1 + ufw on 5555.
      APP_HOST: "0.0.0.0"
      APP_PORT: "5555"
    ports:
      - "127.0.0.1:5555:5555"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
