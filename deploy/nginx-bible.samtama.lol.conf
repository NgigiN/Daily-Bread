# nginx site for Daily Bread Telegram webhook
# Install:
#   sudo cp deploy/nginx-bible.samtama.lol.conf /etc/nginx/sites-available/bible.samtama.lol
#   sudo ln -sf /etc/nginx/sites-available/bible.samtama.lol /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bible.samtama.lol
#
# App listens on 127.0.0.1:5555 (see APP_PORT; 8000 is often already in use).

server {
    listen 80;
    listen [::]:80;
    server_name bible.samtama.lol;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bible multi-chapter fetches can take several seconds
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
